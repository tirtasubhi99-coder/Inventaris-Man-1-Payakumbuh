<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Barang - MAN 1 Payakumbuh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    
    <style>
        .stok-angka { font-weight: 700; font-size: 1.05rem; }
        th.urut { cursor: pointer; user-select: none; }
    </style>
</head>
<body>

        <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-brand"><span class="ikon">🌿</span> Inventaris TU</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" id="linkDashboard">🏠 Dashboard</a>
            <a href="stok.html" class="active">📊 Stok Barang</a>
            <a href="kelola-barang.html">📦 Kelola Barang</a>
            <a href="laporan.html">📑 Laporan</a>
            <a href="index.html">➕ Input Transaksi</a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn btn-outline-danger btn-sm w-100" onclick="keluar()">Keluar</button>
        </div>
    </div>

    <div class="main-area">
        <div class="topbar">
            <h5>Stok Barang</h5>
            <span class="text-muted" style="font-size:14px;">Selamat datang, Admin</span>
        </div>

        <div class="container py-4">

        <!-- RINGKASAN -->
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card kartu-ringkasan p-4 border-start border-primary border-4">
                    <h6 class="text-muted mb-2">Jenis Barang</h6>
                    <h2 class="fw-bold mb-0" id="angkaJenis">...</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card kartu-ringkasan p-4 border-start border-warning border-4">
                    <h6 class="text-muted mb-2">Stok Menipis</h6>
                    <h2 class="fw-bold mb-0" id="angkaMenipis">...</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card kartu-ringkasan p-4 border-start border-danger border-4">
                    <h6 class="text-muted mb-2">Stok Habis</h6>
                    <h2 class="fw-bold mb-0" id="angkaHabis">...</h2>
                </div>
            </div>
        </div>

        <!-- TABEL STOK -->
        <div class="wadah-tabel">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                <h5 class="fw-bold m-0">Stok Barang Saat Ini</h5>
                <div class="d-flex gap-2 flex-wrap">
                    <select class="form-select" id="filterStatus" onchange="tampilkan()">
                        <option value="semua">Semua status</option>
                        <option value="habis">Stok habis</option>
                        <option value="menipis">Stok menipis</option>
                        <option value="aman">Stok aman</option>
                    </select>
                    <input type="text" class="form-control" id="inputPencarian" placeholder="Cari kode atau nama..." oninput="tampilkan()">
                    <button class="btn btn-outline-primary" onclick="muatData(true)" title="Muat ulang data">⟳</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Kode</th>
                            <th class="urut" onclick="urutkan('nama')">Nama Barang ⇅</th>
                            <th class="text-end">Masuk</th>
                            <th class="text-end">Keluar</th>
                            <th class="text-end urut" onclick="urutkan('stok')">Stok ⇅</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="badanTabel">
                        <tr><td colspan="6" class="text-center text-muted py-4">Sedang memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            <small class="text-muted" id="infoJumlah"></small>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // ===== PENGATURAN (silakan ubah) =====
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzYx4-xgjxFdWw5LrUKuZSSUTHkfI6LzOaX8Ft6SmTHJOuRUUdcCgrE1z7IYeD0dvQ/exec';
        const BATAS_MENIPIS = 10;   // stok <= angka ini dianggap menipis
        // Urutan kolom di tab "Master Data" (mulai dari 0):
        const KOL_KODE = 0, KOL_NAMA = 1, KOL_STOK_AWAL = 2, KOL_MASUK = 3, KOL_KELUAR = 4;
        // =====================================

        // Gembok: admin dan staf boleh melihat stok
        if (sessionStorage.getItem("statusLogin") !== "berhasil") {
            window.location.replace("login.html");
        }
        if (sessionStorage.getItem("role") !== "admin") {
            document.getElementById("linkDashboard").classList.add("d-none");
        }

        function keluar() {
            Swal.fire({
                title: 'Keluar dari sistem?',
                text: 'Anda harus login kembali untuk mengakses halaman ini.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#059669',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, keluar',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    sessionStorage.clear();
                    window.location.href = "login.html";
                }
            });
        }

        let semuaBarang = [];
        let urutanKolom = 'stok', urutanNaik = true;

        function hitungStatus(stok) {
            if (stok <= 0) return 'habis';
            if (stok <= BATAS_MENIPIS) return 'menipis';
            return 'aman';
        }

        async function muatData(paksa) {
            const tbody = document.getElementById('badanTabel');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Sedang memuat data...</td></tr>';
            try {
                // Cache 2 menit supaya berpindah halaman terasa cepat
                let data = null;
                const cache = sessionStorage.getItem('cacheData');
                const waktu = Number(sessionStorage.getItem('cacheWaktu')) || 0;
                if (!paksa && cache && Date.now() - waktu < 120000) {
                    data = JSON.parse(cache);
                } else {
                    const res = await fetch(scriptURL);
                    data = await res.json();
                    sessionStorage.setItem('cacheData', JSON.stringify(data));
                    sessionStorage.setItem('cacheWaktu', Date.now());
                }

                semuaBarang = data.master.map(b => {
                    const stokAwal = Number(b[KOL_STOK_AWAL]) || 0;
                    const masuk = Number(b[KOL_MASUK]) || 0;
                    const keluar = Number(b[KOL_KELUAR]) || 0;
                    const stok = stokAwal + masuk - keluar;
                    return { kode: String(b[KOL_KODE] ?? ''), nama: String(b[KOL_NAMA] ?? ''), masuk, keluar, stok, status: hitungStatus(stok) };
                });

                document.getElementById('angkaJenis').innerText = semuaBarang.length;
                document.getElementById('angkaMenipis').innerText = semuaBarang.filter(b => b.status === 'menipis').length;
                document.getElementById('angkaHabis').innerText = semuaBarang.filter(b => b.status === 'habis').length;
                tampilkan();
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Gagal memuat data. Periksa koneksi internet, lalu klik tombol ⟳.</td></tr>';
                Swal.fire({ icon: 'error', title: 'Gagal memuat data', text: 'Periksa koneksi internet Anda, lalu coba lagi.' });
            }
        }

        function urutkan(kolom) {
            if (urutanKolom === kolom) urutanNaik = !urutanNaik;
            else { urutanKolom = kolom; urutanNaik = true; }
            tampilkan();
        }

        function esc(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        function tampilkan() {
            const kata = document.getElementById('inputPencarian').value.toLowerCase();
            const status = document.getElementById('filterStatus').value;

            let hasil = semuaBarang.filter(b =>
                (status === 'semua' || b.status === status) &&
                (b.kode.toLowerCase().includes(kata) || b.nama.toLowerCase().includes(kata))
            );

            hasil.sort((a, b) => {
                const x = a[urutanKolom], y = b[urutanKolom];
                const c = typeof x === 'number' ? x - y : x.localeCompare(y);
                return urutanNaik ? c : -c;
            });

            const tbody = document.getElementById('badanTabel');
            if (hasil.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Tidak ada barang yang cocok.</td></tr>';
            } else {
                const label = {
                    habis: '<span class="badge bg-danger">Habis</span>',
                    menipis: '<span class="badge bg-warning text-dark">Menipis</span>',
                    aman: '<span class="badge bg-success">Aman</span>'
                };
                tbody.innerHTML = hasil.map(b => `
                    <tr class="${b.status === 'habis' ? 'baris-habis' : b.status === 'menipis' ? 'baris-menipis' : ''}">
                        <td class="fw-bold text-primary">${esc(b.kode)}</td>
                        <td>${esc(b.nama)}</td>
                        <td class="text-end">${b.masuk}</td>
                        <td class="text-end">${b.keluar}</td>
                        <td class="text-end stok-angka">${b.stok}</td>
                        <td>${label[b.status]}</td>
                    </tr>`).join('');
            }
            document.getElementById('infoJumlah').innerText = `Menampilkan ${hasil.length} dari ${semuaBarang.length} barang`;
        }

        muatData(false);
    </script>
</body>
</html>
