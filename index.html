<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Transaksi - MAN 1 Payakumbuh</title>
    <!-- Memanggil Framework Bootstrap 5 dan Font Inter -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .form-card {
            width: 100%;
            max-width: 480px;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="text-center mb-4">
            <h4 class="mb-1">Input Data Barang</h4>
            <p class="text-muted" style="font-size: 14px;">Catat barang masuk dan keluar ke sistem</p>
        </div>
        
        <!-- PENTING 1: Masukkan URL Google Script untuk ACTION form (Simpan Data) -->
                <form id="formTransaksi">
            
            <div class="mb-3">
                <label class="form-label">Tanggal Transaksi</label>
                <input type="date" class="form-control" name="Tanggal" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Jenis Transaksi</label>
                <select class="form-select" name="Jenis" required>
                    <option value="" disabled selected>Pilih jenis transaksi...</option>
                    <option value="Masuk">Barang Masuk</option>
                    <option value="Keluar">Barang Keluar</option>
                </select>
            </div>
            
            <!-- INI BAGIAN YANG DIKEMBALIKAN: Datalist pencarian barang -->
            <div class="mb-3">
                <label class="form-label">Pilih Barang</label>
                <input list="daftarBarang" class="form-control" name="Barang" placeholder="Ketik atau pilih kode barang..." required>
                <datalist id="daftarBarang">
                    <!-- Pilihan barang akan dimuat di sini oleh JavaScript dari Google Sheets -->
                </datalist>
            </div>
            
            <div class="mb-4">
                <label class="form-label">Jumlah</label>
                <input type="number" class="form-control" name="Jumlah" placeholder="Masukkan jumlah angka..." min="1" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Penerima / Bagian</label>
                <input type="text" class="form-control" name="Penerima" placeholder="Misal: Bagian Kurikulum, Pak Budi...">
            </div>
                      
            <div class="d-grid gap-2">
               <button type="submit" id="tombolSimpan" class="btn btn-primary py-2">Simpan Transaksi</button>
                <a href="dashboard.html" class="btn btn-outline-secondary py-2">Batal & Kembali</a>
            </div>
            
        </form>
    </div>

    <script>
        // 1. GEMBOK KEAMANAN
        if (sessionStorage.getItem("statusLogin") !== "berhasil") {
            alert("Akses Ditolak! Anda harus login terlebih dahulu.");
            window.location.href = "login.html"; 
        }

        // 2. MENGAMBIL DAFTAR BARANG (Dropdown Otomatis)
        // PENTING 2: Masukkan URL Google Script Anda yang sama persis seperti di Dashboard
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzYx4-xgjxFdWw5LrUKuZSSUTHkfI6LzOaX8Ft6SmTHJOuRUUdcCgrE1z7IYeD0dvQ/exec';  

                // 3. KIRIM FORM TANPA PINDAH HALAMAN
        document.getElementById('formTransaksi').addEventListener('submit', async function (e) {
            e.preventDefault(); // cegah browser pindah halaman

            const form = e.target;
            const tombol = document.getElementById('tombolSimpan');
            tombol.disabled = true;
            tombol.innerText = 'Menyimpan...';

            try {
                const res = await fetch(scriptURL, {
                    method: 'POST',
                    body: new URLSearchParams(new FormData(form))
                });
                const hasil = await res.text();

                if (!res.ok || hasil.indexOf('Sukses') === -1) {
                    throw new Error('Respon tidak sesuai: ' + hasil);
                }

                sessionStorage.removeItem('cacheData'); // agar halaman stok memuat data terbaru

                await Swal.fire({
                    icon: 'success',
                    title: 'Berhasil',
                    text: 'Transaksi berhasil disimpan.',
                    timer: 2000,
                    showConfirmButton: false
                });
                form.reset();
            } catch (error) {
                console.error(error);
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal Menyimpan',
                    text: 'Periksa koneksi internet, lalu coba lagi.'
                });
            } finally {
                tombol.disabled = false;
                tombol.innerText = 'Simpan Transaksi';
            }
        });

        async function muatDaftarBarang() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                
                const dataList = document.getElementById('daftarBarang');
                dataList.innerHTML = ''; 
                
                // Menarik data dari tab "Master Data"
                data.master.forEach(baris => {
                    const option = document.createElement('option');
                    // Menggabungkan Kode Barang dan Nama Barang (misal: BRG-001 - Kertas A4)
                    option.value = baris[1] + " (" + baris[0] + ")"; 
                    dataList.appendChild(option);
                });
            } catch (error) {
                console.error('Terjadi kesalahan memuat daftar barang:', error);
            }
        }

        // Jalankan fungsi penarik data saat halaman dibuka
        muatDaftarBarang();
    </script>

</body>
</html>
